[package]
# 名前は crates.io に初めて出す前に決めます (2026-11-07 の所有者の決定)。Experimental は Git で配ります。
name = "wgft-wgstack"
description = "A sans-IO user-space IPv4 TCP/UDP stack with explicit, accounted memory bounds"
version.workspace = true
edition.workspace = true
# MSRV です。CI が lib と試験をこの版で build します。
rust-version = "1.88"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["tcp", "tcpip", "network-stack", "sans-io", "userspace"]
categories = ["network-programming"]
# crates.io には出しません。Experimental の配布は Git だけです。
publish.workspace = true

[dependencies]

[features]
# 試験と fuzz の道具 (wgft-wgstack-dut) だけが使う。書き換えた枠だけの確かめと核の使い回しの口を開ける。
# 製品の build (`-p wgft`) はこの feature を付けず、口と欄は製品の build にない (docs/design/v2/wgstack-rs.md の
# 「boost の hook」の後の規則)。feature が開ける口は #[doc(hidden)] で、公開の API と互換の保証の外です。
harness = []

[lints]
workspace = true
