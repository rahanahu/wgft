# cargo-fuzz の target (docs/design/v2/test-tooling.md の 6 節)。nightly で `cargo fuzz run <target>` が使います。
# 自分の [workspace] を持ち、リポジトリのワークスペースの member に入りません。
[package]
name = "wgft-wgstack-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4.13"
wgft-wgstack = { path = ".." }

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false
