# wgft-wgstack だけに効く clippy の設定 (docs/design/v2/wgstack-rs.md の「依存と隔離の検査」と「確保の規則」)。
# clippy はこの crate の manifest の directory から上へ設定を探すので、この一覧はほかの crate に効かない。
# 核は sans-IO で、時刻、乱数、ソケット、スレッドを自分で持たない。可変長の保持は FixedVec だけで、容量を自動で
# 伸ばす API を使わない。FixedVec の実装だけが #[expect(..., reason = "...")] で例外になる。
# src/scan_tests.rs が、この一覧の項目が消えていないことと、clippy が見ない cfg の中のコードを文字列で確かめる。

disallowed-methods = [
  { path = "std::time::Instant::now", reason = "the core is sans-IO: the caller passes the time" },
  { path = "std::time::SystemTime::now", reason = "the core is sans-IO: the caller passes the time" },
  { path = "std::thread::spawn", reason = "the core is sans-IO and owns no threads" },
  { path = "std::thread::Builder::spawn", reason = "the core is sans-IO and owns no threads" },
  { path = "std::thread::sleep", reason = "the core is sans-IO and never waits" },
  { path = "std::collections::hash_map::RandomState::new", reason = "the core reads no OS randomness: the caller passes the seed" },
  { path = "std::vec::Vec::with_capacity", reason = "aborts on allocation failure; use FixedVec::try_with_capacity" },
  { path = "std::vec::Vec::push", reason = "grows the capacity; use FixedVec::try_push" },
  { path = "std::vec::Vec::insert", reason = "grows the capacity; use FixedVec" },
  { path = "std::vec::Vec::append", reason = "grows the capacity; use FixedVec" },
  { path = "std::vec::Vec::resize", reason = "grows the capacity; use FixedVec" },
  { path = "std::vec::Vec::resize_with", reason = "grows the capacity; use FixedVec" },
  { path = "std::vec::Vec::extend_from_slice", reason = "grows the capacity; use FixedVec::try_extend_from_slice" },
  { path = "std::vec::Vec::extend_from_within", reason = "grows the capacity; use FixedVec" },
  { path = "std::vec::Vec::reserve", reason = "aborts on allocation failure; use FixedVec" },
  { path = "std::vec::Vec::reserve_exact", reason = "aborts on allocation failure; use FixedVec" },
  { path = "std::vec::Vec::try_reserve", reason = "only FixedVec allocates" },
  { path = "std::vec::Vec::try_reserve_exact", reason = "only FixedVec allocates" },
  { path = "std::vec::Vec::into_boxed_slice", reason = "reallocates to shrink; FixedVec keeps the Vec" },
  { path = "std::iter::Extend::extend", reason = "grows the capacity; use FixedVec" },
  { path = "std::iter::Iterator::collect", reason = "allocates and grows; use FixedVec" },
  { path = "std::iter::FromIterator::from_iter", reason = "allocates and grows; use FixedVec" },
  { path = "slice::to_vec", reason = "allocates and aborts on failure; use FixedVec::try_from_slice" },
  { path = "std::boxed::Box::new", reason = "aborts on allocation failure; use FixedVec" },
  { path = "std::string::String::push", reason = "grows the capacity; the core builds no strings" },
  { path = "std::string::String::push_str", reason = "grows the capacity; the core builds no strings" },
  { path = "std::borrow::ToOwned::to_owned", reason = "allocates and aborts on failure; use FixedVec" },
  { path = "alloc::string::ToString::to_string", reason = "allocates a string; the core builds no strings" },
  { path = "std::borrow::Cow::into_owned", reason = "allocates and aborts on failure; use FixedVec" },
  { path = "std::io::stdin", reason = "the core is sans-IO and reads no standard streams" },
  { path = "std::io::stdout", reason = "the core is sans-IO and writes no standard streams" },
  { path = "std::io::stderr", reason = "the core is sans-IO and writes no standard streams" },
  { path = "std::env::var", reason = "the core reads no environment: the caller passes the configuration" },
  { path = "std::env::var_os", reason = "the core reads no environment: the caller passes the configuration" },
  { path = "std::env::vars", reason = "the core reads no environment: the caller passes the configuration" },
  { path = "std::env::args", reason = "the core reads no environment: the caller passes the configuration" },
  { path = "std::process::exit", reason = "the core never ends the process" },
  { path = "std::process::abort", reason = "the core never ends the process" },
  { path = "std::fs::read", reason = "the core touches no files" },
  { path = "std::fs::read_to_string", reason = "the core touches no files" },
  { path = "std::fs::write", reason = "the core touches no files" },
  { path = "std::fs::read_dir", reason = "the core touches no files" },
  { path = "std::fs::File::open", reason = "the core touches no files" },
  { path = "std::fs::File::create", reason = "the core touches no files" },
]

disallowed-types = [
  { path = "std::vec::Vec", reason = "variable-length holdings use FixedVec, which never grows" },
  { path = "std::collections::VecDeque", reason = "grows the capacity; use a fixed ring" },
  { path = "std::collections::HashMap", reason = "grows the capacity and reads OS randomness; use the fixed tables" },
  { path = "std::collections::HashSet", reason = "grows the capacity and reads OS randomness; use the fixed tables" },
  { path = "std::collections::BTreeMap", reason = "grows; use the fixed tables" },
  { path = "std::collections::BTreeSet", reason = "grows; use the fixed tables" },
  { path = "std::collections::BinaryHeap", reason = "grows; use the timer wheel" },
  { path = "std::collections::LinkedList", reason = "allocates per node; use index lists" },
  { path = "std::boxed::Box", reason = "allocates and aborts on failure; FixedVec holds the variable-length data" },
  { path = "std::rc::Rc", reason = "allocates and aborts on failure; the core owns its values" },
  { path = "std::sync::Arc", reason = "allocates and aborts on failure; the core owns its values" },
  { path = "std::fs::File", reason = "the core touches no files" },
  { path = "std::fs::OpenOptions", reason = "the core touches no files" },
  { path = "std::process::Command", reason = "the core starts no processes" },
  { path = "std::process::Child", reason = "the core starts no processes" },
  { path = "std::string::String", reason = "the core builds no strings; the driver writes the log lines" },
  { path = "std::time::Instant", reason = "the core is sans-IO: the caller passes the time" },
  { path = "std::time::SystemTime", reason = "the core is sans-IO: the caller passes the time" },
  { path = "std::net::UdpSocket", reason = "the core is sans-IO and owns no sockets" },
  { path = "std::net::TcpStream", reason = "the core is sans-IO and owns no sockets" },
  { path = "std::net::TcpListener", reason = "the core is sans-IO and owns no sockets" },
]

disallowed-macros = [
  { path = "std::vec", reason = "allocates and aborts on failure; use FixedVec" },
  { path = "std::format", reason = "the core builds no strings" },
  { path = "std::print", reason = "the core writes no logs; poll_log hands the counts to the driver" },
  { path = "std::println", reason = "the core writes no logs; poll_log hands the counts to the driver" },
  { path = "std::eprint", reason = "the core writes no logs; poll_log hands the counts to the driver" },
  { path = "std::eprintln", reason = "the core writes no logs; poll_log hands the counts to the driver" },
]
