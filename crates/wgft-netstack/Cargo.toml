[package]
name = "wgft-netstack"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Async TCP, UDP and ping handles over the wgstack core"

[dependencies]
tokio = { workspace = true, features = ["sync"] }
wgft-wgstack.workspace = true

[features]
# 待つ `send_to` の口を開ける。試験と Go の recording の道具だけが使い、製品の build にはない。
harness = ["wgft-wgstack/harness"]

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util", "io-util"] }
wgft-alloc-count.workspace = true

# 待つ `send_to` を使う結合試験は harness の feature が要る。試験の道具の crate (wgft-wgstack-dut) が付けるので、
# `--workspace` の試験では動く。`-p wgft-netstack` だけでは build されないので、`--features harness` を付ける
[[test]]
name = "netstack"
required-features = ["harness"]

[[test]]
name = "alloc"
required-features = ["harness"]

[[test]]
name = "alloc_calls"
required-features = ["harness"]
