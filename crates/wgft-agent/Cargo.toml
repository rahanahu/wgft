[package]
name = "wgft-agent"
description = "wgft agent control plane prototype for the v2 Rust migration"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
futures-util = { workspace = true, features = ["sink", "std"] }
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
ring.workspace = true
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
socket2 = { workspace = true, features = ["all"] }
time = { workspace = true, features = ["formatting", "local-offset", "macros"] }
tokio = { workspace = true, features = ["rt", "macros", "net", "time", "sync", "signal", "io-util", "fs"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }
tokio-tungstenite = { workspace = true, features = ["handshake"] }
wgft-proto.workspace = true
wgft-wireguard.workspace = true
wgft-wireguard-tun.workspace = true
zeroize = { workspace = true, features = ["zeroize_derive"] }

[lints]
workspace = true

[target."cfg(unix)".dependencies]
libc.workspace = true
