# v2 の Rust ワークスペース。Go のモジュール (go.mod) は v2.0.0 まで別に残る。
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rahanahu/wgft"
publish = false

[workspace.dependencies]
# 版はここだけに書き、各 crate は `name.workspace = true` で継ぐ
wgft-wireguard = { path = "crates/wgft-wireguard" }
wgft-wireguard-tun = { path = "crates/wgft-wireguard-tun" }
wgft-proto = { path = "crates/wgft-proto" }
wgft-agent = { path = "crates/wgft-agent" }
wgft-wgstack = { path = "crates/wgft-wgstack" }
wgft-wgstack-bench = { path = "crates/wgft-wgstack-bench" }
wgft-tcpharness = { path = "crates/wgft-tcpharness" }
wgft-netstack = { path = "crates/wgft-netstack" }
wgft-alloc-count = { path = "crates/wgft-alloc-count" }
base64 = "0.23.1"
criterion = "0.8.2"
flate2 = "1.1.10"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
libc = "0.2.191"
libtest-mimic = "0.8.2"
proptest = "1.12.0"
sanstun = "0.1.0"
tokio = "1.54.1"
zeroize = "1.9.1"
futures-util = { version = "0.3.34", default-features = false }
http-body-util = "0.1.5"
hyper = "1.12.0"
hyper-util = "0.1.21"
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false }
serde = "1.0.229"
serde_json = "1.0.154"
socket2 = "0.6.5"
tempfile = "3.27.0"
time = "0.3.55"
tokio-rustls = { version = "0.26.6", default-features = false }
tokio-tungstenite = { version = "0.30.0", default-features = false }
unicode-general-category = "1.1.0"
windows-sys = "0.61.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
unused_extern_crates = "warn"
# 製品の build に渡さない cfg。fuzzing は cargo-fuzz が付ける (crates/wgft-wgstack/fuzz)。
# wgstack_sentinel は置き場に返す chunk を目印の byte で埋める build、wgstack_fault は故障を入れる build で、
# どちらも RUSTFLAGS の --cfg で選ぶ (docs/design/v2/wgstack-rs.md の「故障の注入と目印の build」)。
# 故障の名前は故障の点を足す PR が values に足す。
# crate の [lints] は workspace = true とほかの項目を併せて書けないので、ここで宣言する。
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)", "cfg(wgstack_sentinel)", "cfg(wgstack_fault, values(none()))"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# pedantic のうち、この規模では雑音になるものを個別に外す。cast_* は残す。
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
similar_names = "allow"
too_many_lines = "allow"
module_name_repetitions = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
# 許可は #[allow] でなく #[expect] で書く。
allow_attributes = "deny"
# 局所的な許可は #[expect(..., reason = "...")] で理由を書く。
allow_attributes_without_reason = "deny"

# The wgstack core's white-box tests run check_invariants after every step and replay long ACK floods. Optimising
# the core in dev and test builds keeps them fast; overflow checks and debug assertions stay on.
[profile.dev.package.wgft-wgstack]
opt-level = 2

# Release builds keep overflow checks in the two crates that parse what the network sends: the TCP/IP
# core and the WireGuard device. An arithmetic overflow there is a bug an attacker may reach, and a
# panic is the bounded outcome: the data plane thread unwinds and the agent rebuilds the tunnel, which needs
# panic = "unwind" (the default). The per-segment cost is in docs/design/v2/wgstack-rs.md.
[profile.release.package.wgft-wgstack]
overflow-checks = true

[profile.release.package.wgft-wireguard]
overflow-checks = true
