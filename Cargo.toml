# v2 の Rust ワークスペース。Go のモジュール (go.mod) は v2.0.0 まで別に残る。
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rahanahu/wgft"
publish = false

[workspace.dependencies]
# 版はここだけに書き、各 crate は `name.workspace = true` で継ぐ
wgft-wireguard = { path = "crates/wgft-wireguard" }
base64 = "0.23.1"
proptest = "1.12.0"
sanstun = "0.1.0"
zeroize = "1.9.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
unused_extern_crates = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# pedantic のうち、この規模では雑音になるものを個別に外す。cast_* は残す。
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
similar_names = "allow"
too_many_lines = "allow"
module_name_repetitions = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
# 許可は #[allow] でなく #[expect] で書く。
allow_attributes = "deny"
# 局所的な許可は #[expect(..., reason = "...")] で理由を書く。
allow_attributes_without_reason = "deny"
