name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: go mod tidy leaves go.mod and go.sum unchanged
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...
      # The agent and the CLI also build for Windows and macOS (the server is Linux only). Nothing
      # is run there; this only keeps those builds from breaking.
      - name: cross-build for windows and darwin
        run: |
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/wgft
            GOOS=${target%/*} GOARCH=${target#*/} go vet ./cmd/... ./internal/agent/... ./internal/flock/...
          done
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  windows-test:
    # Runs the packages that actually build and pass on native Windows today: the agent
    # (including its credentials/ACL handling), flock, and the CLI. internal/vpsd and its
    # subpackages are Linux-only (kernel WireGuard, nftables) and are not part of this job;
    # the build-test job's cross-build step already keeps ./cmd/wgft buildable for Windows,
    # this job additionally runs the Windows-specific code paths.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: test
        run: go test ./internal/agent/... ./internal/flock/... ./cmd/wgft/...

  lint-output:
    # Keeps tool output English (no Japanese in string literals) and punctuation ASCII
    # in published files. Lab integration tests need Incus and are not run in CI
    # (see lab/README.md); they run on a developer VM.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: no Japanese in string literals
        run: go run ./scripts/check-japanese/
      - name: ASCII punctuation in public files
        run: bash scripts/check-ascii-punct.sh
      - name: no token values in logs
        run: bash scripts/check-log-tokens.sh
