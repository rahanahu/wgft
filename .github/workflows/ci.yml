name: CI

# Trigger names in the comments below are the ones docs/testing.md's "変更の契機と対象のパス"
# table defines, except go_code (see below). Two of that table's triggers gate a job that
# actually runs on GitHub's runners; the rest gate lab-only B-class tests (B1, B2, B3, B7, B9,
# B10) that need Incus and never run here.
#
#   go_code -> **/*.go, go.mod, go.sum -> gates windows-test (B4), macos-test (B8)
#
#     This is wider than the table's own agent-platform trigger (internal/agent/**,
#     internal/flock/**, internal/dataplane/userspace/relay/**,
#     internal/dataplane/userspace/tunnel/**, cmd/wgft/**, *_windows.go, *_darwin.go), which
#     stays the correct definition for the manual, real-machine tests (D1, D2, E4, E5) that
#     exercise things a CI runner cannot (ACLs, sleep/resume, launchd, adapter changes). For
#     the two CI jobs, agent-platform is not safe: they run cmd/wgft's and internal/agent's
#     own test suites, and those tests build a real server-side store, admin backend, and
#     model, so a change anywhere in the packages those import (internal/vpsd/store,
#     internal/vpsd/admin, proto, internal/model, internal/policy, internal/resource,
#     internal/nettun, and more) can change what runs on Windows or macOS, and that import
#     graph is too large and too easily extended to track by hand as a path list. A change
#     outside the platform-specific files can still break only one OS: for example, code that
#     builds a filesystem path or a file: URI with forward slashes works on Linux and macOS
#     but not on Windows, and only a job that actually runs on Windows catches it. Because of
#     this, windows-test and macos-test run on any change that touches a .go file or the
#     module (go.mod, go.sum), and are skipped only when a change touches no Go code at all
#     (documents, lab scripts, deploy/ text files, images).
#
#   build    -> .goreleaser.yaml, scripts/build-release.sh, scripts/goreleaser-checksum.sh,
#               scripts/third-party-licenses.sh, scripts/check-release-assets.sh,
#               scripts/docker-smoke.sh, deploy/Dockerfile.*, deploy/*.compose.yaml,
#               go.mod, go.sum, .github/workflows/**
#               -> gates release-snapshot (B5) as docs/testing.md's table says, unwidened:
#               B5's risk is GoReleaser's own configuration, hooks and asset naming, which an
#               ordinary Go source change does not touch; that a plain code change still
#               compiles is already checked by build-test's build and cross-build steps,
#               which run on every push and pull request regardless of path.
#               -> also gates govulncheck (B6), OR'd with go_code above: B6's risk is a known
#               vulnerability becoming reachable, which depends on the whole call graph, so a
#               Go source change can change the result without touching go.mod or go.sum.
#               This second part widens the table's own build-only mapping for B6, for the
#               same reachability reason as go_code above.
#
# A change to .github/workflows/** (the `workflows` filter below) additionally forces every
# gated job to run, on top of what `build` and `go_code` already cover: a ci.yml change can
# change how the other jobs behave, so path filtering must not be trusted to judge its own
# correctness.
#
#   docs_only -> gates build-test (A1, A2, A5, A6, A7) the other way round: that job is
#               skipped only when every file the change touches is a Markdown document or an
#               image under docs/images/. This is docs/testing.md's own definition of a change
#               that is not code, and the exception it names applies here too: docs/cli.md is
#               generated from cmd/wgft/helptext.go and compared against it by
#               TestCLIDocUpToDate, so a change touching it is a code change and does not
#               count as docs_only.
#
#     Unlike go_code, this is an allowlist evaluated over every changed path, so anything the
#     list does not name runs the job. That direction is what makes it safe to skip a job whose
#     `go test ./...` reads files that are not Go source: besides docs/cli.md, the Web UI
#     templates and static files that internal/vpsd/admin embeds with go:embed, lab/suite.txt
#     that tools/labhost's suite_test.go loads, and the testdata directories under
#     internal/policy and internal/dataplane/linuxkernel/nft. None of those is a Markdown file
#     or an image under docs/images/, so none of them can be skipped by mistake, and a new one
#     added later cannot either. A change that mixes a document with anything else runs the job.
#
# lint-output (A8) is not gated at all: it is what catches full-width punctuation in README.md
# and docs/*.md, which is exactly the kind of change docs_only describes.
#
# Every job below always reports a status. The workflow itself always triggers on push and
# pull_request; only the job body is conditional on the `changes` job's output, so a job this
# PR doesn't need shows up as skipped rather than missing. GitHub treats a skipped job as
# passing for a required status check, so this is safe even if `main` later requires these
# checks to pass before a squash merge (see docs/testing.md's "CI とラボの関係").

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly govulncheck (B6), independent of any PR: new advisories affect code nobody
    # touched. 03:17 UTC Tuesday is away from the UTC-midnight rush GitHub's scheduling
    # documentation warns can delay jobs, and away from any release-day activity.
    - cron: "17 3 * * 2"
  workflow_dispatch:
    # Lets a human re-run govulncheck on demand (a new advisory doesn't wait for the
    # weekly schedule or a qualifying code change), or force a full run of every job.

permissions:
  contents: read

jobs:
  changes:
    # Decides which of the gates above this run hits. This job itself always runs
    # regardless of event type; it is cheap (checkout plus a path diff), and always having
    # its outputs available keeps the jobs below simple. It never fails the whole run: the
    # paths-filter step is allowed to fail, and the decide step turns that into "run
    # everything" instead (see the fail-open rule below).
    runs-on: ubuntu-latest
    outputs:
      run_all: ${{ steps.decide.outputs.run_all }}
      docs_only: ${{ steps.decide.outputs.docs_only }}
      go_code: ${{ steps.filter.outputs.go_code }}
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          # dorny/paths-filter needs the commits it diffs between. A push event compares
          # against github.event.before, which the default shallow (depth 1) checkout
          # would not contain.
          fetch-depth: 0
      - id: filter
        # v4.0.3 (https://github.com/dorny/paths-filter/releases/tag/v4.0.3), pinned by
        # major-version tag. This is not a full commit SHA: every action already in this
        # file and in release.yml (actions/checkout@v7, goreleaser/goreleaser-action@v7,
        # docker/setup-buildx-action@v3, docker/login-action@v4, anchore/sbom-action@v0,
        # actions/attest-build-provenance@v4, actions/attest-sbom@v4) is pinned the same
        # way, so a lone SHA pin here would be an inconsistency rather than an improvement.
        uses: dorny/paths-filter@v4
        continue-on-error: true
        with:
          # changed_files below carries every path this change touches, which the decide step
          # needs to answer "is this nothing but documents?". The filters themselves cannot
          # answer that: each one reports whether ANY changed path matched it, never whether
          # ALL of them did.
          list-files: json
          filters: |
            changed:
              - '**'
            workflows:
              - '.github/workflows/**'
            go_code:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
            build:
              - '.goreleaser.yaml'
              - 'scripts/build-release.sh'
              - 'scripts/goreleaser-checksum.sh'
              - 'scripts/third-party-licenses.sh'
              - 'scripts/check-release-assets.sh'
              - 'scripts/docker-smoke.sh'
              - 'deploy/Dockerfile.*'
              - 'deploy/*.compose.yaml'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/**'
      - id: decide
        # Fail-open rule: a push with no reachable "before" commit (first push of a new
        # branch, a force push) or any other failure of the filter step above must not
        # silently skip everything, so run_all becomes true instead. workflow_dispatch has
        # no base to diff against either, and by nature asks for a full run. A change to
        # the workflow files themselves (the `workflows` filter) also sets run_all, for the
        # reason in the header comment. A schedule event never sets run_all: its only
        # purpose is the govulncheck run below, which checks github.event_name directly.
        #
        # docs_only follows the same fail-open rule from the other side: it stays false
        # unless the file list is present and every entry in it is a document, so every
        # case that sets run_all leaves docs_only false and build-test runs.
        env:
          # Through the environment rather than an expression inside the script: this value
          # is file names from the change being tested.
          CHANGED_FILES: ${{ steps.filter.outputs.changed_files }}
        run: |
          event="${{ github.event_name }}"
          outcome="${{ steps.filter.outcome }}"
          before="${{ github.event.before }}"
          workflows_changed="${{ steps.filter.outputs.workflows }}"
          run_all=false
          if [ "$event" = "workflow_dispatch" ]; then
            run_all=true
          elif [ "$event" = "schedule" ]; then
            run_all=false
          elif [ "$outcome" != "success" ]; then
            run_all=true
          elif [ "$before" = "0000000000000000000000000000000000000000" ]; then
            run_all=true
          elif [ "$workflows_changed" = "true" ]; then
            run_all=true
          fi
          echo "run_all=$run_all" >> "$GITHUB_OUTPUT"

          # A change is documents only when it touches at least one file and every one of
          # them is a Markdown document other than the generated docs/cli.md, or an image
          # under docs/images/. See the header comment for why the test is written as an
          # allowlist over the whole list.
          docs_only=false
          if [ "$run_all" = "false" ] && [ -n "$CHANGED_FILES" ]; then
            if printf '%s' "$CHANGED_FILES" | jq -e '
                  length > 0 and all(
                    . != "docs/cli.md"
                    and (endswith(".md") or startswith("docs/images/"))
                  )' > /dev/null; then
              docs_only=true
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  build-test:
    # A1, A2, A5, A6, A7 (see docs/testing.md). Every check in it reads Go source, go.mod,
    # go.sum or a file the Go tests load, so a change that touches nothing but documents and
    # images cannot alter its result. Skipped in exactly that case and run otherwise,
    # including whenever the changes job could not decide; see the header comment. Not run on
    # the weekly schedule (that event exists only to drive govulncheck below).
    needs: changes
    if: >-
      !cancelled() && github.event_name != 'schedule' && (
        needs.changes.result != 'success' ||
        needs.changes.outputs.docs_only != 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: go mod tidy leaves go.mod and go.sum unchanged
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...
      # The agent and the CLI also build for Windows and macOS (the server is Linux only). Nothing
      # is run there; this only keeps those builds from breaking.
      - name: cross-build for windows and darwin
        run: |
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/wgft
            GOOS=${target%/*} GOARCH=${target#*/} go vet ./cmd/... ./internal/agent/... ./internal/dataplane/userspace/relay/... ./internal/dataplane/userspace/tunnel/... ./internal/dataplane/userspace/utun/... ./internal/flock/...
          done
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...

  windows-test:
    # Builds and vets the whole tree on native Windows first: the top-level internal/vpsd
    # package, internal/dataplane/linuxkernel and its subpackages, and internal/platform/linux
    # are Linux-only (kernel WireGuard, nftables) and rely on `//go:build linux` tags to
    # keep the rest of the tree buildable on Windows (#109); without a step that actually
    # runs `go build ./...` / `go vet ./...` here, a later file added to one of those
    # packages without that tag would stay green and silently break the Windows build
    # again. It then runs the packages that actually build and pass on native Windows
    # today: the agent (including its credentials/ACL handling), the relay it shares with
    # the server's userspace mode, flock, the CLI, and the server's userspace tunnel bind
    # (internal/dataplane/userspace/utun); the parent internal/dataplane/userspace package
    # is excluded because TestPrepareBindFailureIsFailClosed fails there on native Windows
    # (issue #109). `go test ./...` is deliberately not run here: internal/dataplane/userspace,
    # internal/vpsd/store and tools/labhost have known pre-existing POSIX-assumption test
    # failures on native Windows.
    #
    # Gated by go_code, not by the table's agent-platform trigger (B4, see the header
    # comment for why). Runs whenever the changes job could not tell (run_all, including
    # its own failure) or a .go file, go.mod or go.sum changed; !cancelled() keeps this
    # from being auto-skipped just because `changes` was skipped or failed, which is the
    # default behaviour for a job with `needs:`.
    needs: changes
    if: >-
      !cancelled() && github.event_name != 'schedule' && (
        needs.changes.result != 'success' ||
        needs.changes.outputs.run_all == 'true' ||
        needs.changes.outputs.go_code == 'true'
      )
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./internal/agent/... ./internal/dataplane/userspace/relay/... ./internal/dataplane/userspace/tunnel/... ./internal/dataplane/userspace/utun/... ./internal/flock/... ./cmd/wgft/...

  macos-test:
    # Runs the same packages as windows-test, on GitHub's Apple silicon runner, including
    # internal/dataplane/userspace/utun: its inprocess_forward_test.go
    # (TestAgentServerInProcessForwarding) is cross-platform and this is where it gives B8
    # coverage (docs/testing.md). utun's bind_windows_test.go carries its own
    # `//go:build windows` tag, so it does not compile or run here, and this job makes no
    # claim about the Windows-specific bind fix it regression-tests. This is
    # the first job that actually executes the darwin-specific code paths (sndbuf_darwin.go's
    # SO_SNDBUF workaround for macOS's 9216-byte default UDP send buffer, docs/testing.md's
    # B8); the build-test job's cross-build step only compiles for darwin and does not run
    # anything.
    #
    # Gated the same way as windows-test, above.
    needs: changes
    if: >-
      !cancelled() && github.event_name != 'schedule' && (
        needs.changes.result != 'success' ||
        needs.changes.outputs.run_all == 'true' ||
        needs.changes.outputs.go_code == 'true'
      )
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: test
        run: go test ./internal/agent/... ./internal/dataplane/userspace/relay/... ./internal/dataplane/userspace/tunnel/... ./internal/dataplane/userspace/utun/... ./internal/flock/... ./cmd/wgft/...

  release-snapshot:
    # .github/workflows/release.yml only runs `goreleaser release --clean` on a `v*` tag push,
    # so nothing else in CI exercises .goreleaser.yaml, its hooks (scripts/third-party-licenses.sh,
    # scripts/goreleaser-checksum.sh), or the asset names those hooks produce. This job runs the
    # same GoReleaser in snapshot mode on every push and PR and checks the resulting dist/ against
    # the released asset names, so a mismatch like #22's wgft-windows-amd64.sha256 naming a file
    # actually published as wgft-windows-amd64.exe fails here instead of only being caught by
    # someone running a snapshot by hand.
    #
    # Gated by the build trigger only, not go_code (B5, see the header comment for why an
    # ordinary Go source change does not need this job).
    needs: changes
    if: >-
      !cancelled() && github.event_name != 'schedule' && (
        needs.changes.result != 'success' ||
        needs.changes.outputs.run_all == 'true' ||
        needs.changes.outputs.build == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser needs full history and tags for the changelog and `git describe`,
          # same as release.yml.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          # Same action version and GoReleaser version constraint as release.yml, so this
          # job and the real release run the same GoReleaser.
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
      - name: verify released assets and their checksums
        run: bash scripts/check-release-assets.sh dist

  govulncheck:
    # Known-vulnerability scan of the module graph (B6). Gated by the build trigger and by
    # go_code (see the header comment: a Go source change can make an existing vulnerable
    # dependency reachable without touching go.mod or go.sum), plus two triggers of its
    # own: the weekly schedule and a manual workflow_dispatch (both checked directly
    # against github.event_name, not through the changes job, since neither has a
    # meaningful diff to filter). A scheduled failure is not silent: GitHub emails the
    # repository owner when a scheduled workflow run fails, without any extra bot or
    # issue-creation step.
    needs: changes
    if: >-
      !cancelled() && (
        github.event_name == 'schedule' ||
        needs.changes.result != 'success' ||
        needs.changes.outputs.run_all == 'true' ||
        needs.changes.outputs.build == 'true' ||
        needs.changes.outputs.go_code == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  lint-output:
    # Keeps tool output English, without round parentheses, and punctuation ASCII
    # in published files. Lab integration tests need Incus and are not run in CI
    # (see lab/README.md); they run on a developer VM.
    #
    # Not gated: A8 runs on every PR regardless of what changed, including a
    # documentation-only change, since this is what catches full-width punctuation
    # creeping into README.md, docs/*.md and similar public files. Not run on the
    # weekly schedule, which exists only to drive govulncheck above.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: no Japanese in string literals
        run: go run ./scripts/check-japanese/
      - name: no round parentheses in English string literals
        run: go run ./scripts/check-parens/
      - name: ASCII punctuation in public files
        run: bash scripts/check-ascii-punct.sh
      - name: no token values in logs
        run: bash scripts/check-log-tokens.sh
