name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser needs full history and tags for the changelog and
          # `git describe` (see .goreleaser.yaml).
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Builds and pushes the agent image straight from deploy/Dockerfile.agent
  # (single source of truth: the same Dockerfile developers use locally with
  # `docker build -f deploy/Dockerfile.agent .`, see .goreleaser.yaml for why
  # this isn't a GoReleaser dockers section instead).
  agent-image:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        env:
          IMAGE: ghcr.io/rahanahu/wgft-agent
          TAG: ${{ github.ref_name }}
        run: |
          docker build -f deploy/Dockerfile.agent --build-arg "VERSION=$TAG" -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
