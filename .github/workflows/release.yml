name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser needs full history and tags for the changelog and
          # `git describe` (see .goreleaser.yaml).
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Signs what users download. Runs after the release exists and fetches the published binaries
  # back, so the attested digests are those of the release assets themselves. It is a separate
  # job on purpose: if attestation or the SBOM tooling breaks, the release and the images still
  # come out. Verify with:
  #   gh attestation verify wgft-linux-amd64 --repo rahanahu/wgft
  attest:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the SBOMs to the release
      id-token: write # keyless signing through Sigstore
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: download the released binaries
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir rel \
            --pattern wgft-linux-amd64 --pattern wgft-linux-arm64
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            rel/wgft-linux-amd64
            rel/wgft-linux-arm64
      # SBOM from the module information embedded in each Go binary
      - uses: anchore/sbom-action@v0
        with:
          file: rel/wgft-linux-amd64
          format: spdx-json
          output-file: rel/wgft-linux-amd64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/sbom-action@v0
        with:
          file: rel/wgft-linux-arm64
          format: spdx-json
          output-file: rel/wgft-linux-arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest-sbom@v4
        with:
          subject-path: rel/wgft-linux-amd64
          sbom-path: rel/wgft-linux-amd64.spdx.json
      - uses: actions/attest-sbom@v4
        with:
          subject-path: rel/wgft-linux-arm64
          sbom-path: rel/wgft-linux-arm64.spdx.json
      - name: attach the SBOMs to the release
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" rel/*.spdx.json

  # Builds and pushes the agent image straight from deploy/Dockerfile.agent
  # (single source of truth: the same Dockerfile developers use locally with
  # `docker build -f deploy/Dockerfile.agent .`, see .goreleaser.yaml for why
  # this isn't a GoReleaser dockers section instead).
  agent-image:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # buildx builds both platforms in one go; the Dockerfile cross-compiles, so no QEMU is needed.
      # --provenance and --sbom attach build provenance and an SBOM to the image index in the registry.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        env:
          IMAGE: ghcr.io/rahanahu/wgft-agent
          TAG: ${{ github.ref_name }}
        run: |
          docker buildx build -f deploy/Dockerfile.agent --platform linux/amd64,linux/arm64 \
            --provenance=mode=max --sbom=true \
            --build-arg "VERSION=$TAG" -t "$IMAGE:$TAG" -t "$IMAGE:latest" --push .

  # Builds and pushes the server image straight from deploy/Dockerfile.server, same reasoning
  # as agent-image above. This image runs the userspace mode only (docs/design.md section 6.3);
  # kernel mode is not supported in a container.
  server-image:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # buildx builds both platforms in one go; the Dockerfile cross-compiles, so no QEMU is needed
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        env:
          IMAGE: ghcr.io/rahanahu/wgft-server
          TAG: ${{ github.ref_name }}
        run: |
          docker buildx build -f deploy/Dockerfile.server --platform linux/amd64,linux/arm64 \
            --provenance=mode=max --sbom=true \
            --build-arg "VERSION=$TAG" -t "$IMAGE:$TAG" -t "$IMAGE:latest" --push .
