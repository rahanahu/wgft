# Docker Compose for the home agent.
#
#   docker compose -f deploy/agent.compose.yaml up -d
#
# The image is pulled from GHCR (amd64 and arm64). To build it from this repository instead,
# uncomment the build: lines below and add --build to the command above.
#
# Notes
# - No privileges: no --privileged, no cap_add, no devices (user-space netstack, so no TUN).
# - The image runs as uid 65532 (the distroless "nonroot" user), not root. The named volume
#   below is fine as is: Docker/Podman initialise a named volume from the image directory,
#   ownership included, so /var/lib/wgft in the volume comes out owned by 65532. If you swap
#   the volume for a bind mount instead (for example "-v ./data:/var/lib/wgft"), the host
#   directory must be owned by uid 65532 or otherwise writable by it, since a bind mount keeps
#   the host directory's own ownership.
# - Outbound: it must reach the WireGuard port on the VPS (UDP 51820).
# - LAN: it must reach the forwarding targets (for example 192.168.1.20:25565). The default
#   bridge network normally reaches the LAN through the host. If it does not, use network_mode: host.
# - WGFT_JOIN is the join string printed by `wgft agent join-string` on the VPS, pasted exactly as
#   printed. It is single-use and consumed on first registration. Once agent.json exists you may
#   remove the line; if it stays, the agent does not re-register while the credentials file exists.
# - WGFT_NAME is optional: the agent name comes from the join string. Delete the line or leave it
#   empty unless you want to double-check it against the name the join string is bound to.
services:
  wgft-agent:
    image: ghcr.io/rahanahu/wgft-agent:latest
    # build:
    #   context: ..
    #   dockerfile: deploy/Dockerfile.agent
    container_name: wgft-agent
    restart: unless-stopped
    # No capabilities, no privilege escalation, read-only root file system. The only writable
    # path is the state volume.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    environment:
      WGFT_JOIN: "REPLACE_WITH_JOIN_STRING"
      WGFT_NAME: ""
      # Optional: process-wide caps on concurrent flows. The values below are the defaults. They
      # bound the memory of the agent when many flows are opened and held, and the memory soft
      # limit printed at startup is derived from them. Lower them on a host with little memory.
      # WGFT_MAX_UDP_FLOWS: "8192"
      # WGFT_MAX_TCP_FLOWS: "2048"
    volumes:
      - wgft-agent-state:/var/lib/wgft
    # If the container cannot reach the LAN, use this instead of the bridge above:
    # network_mode: host

volumes:
  wgft-agent-state:
