# Docker Compose for the VPS-side server, running the userspace mode (docs/design.md section 6.3).
# No root, no kernel WireGuard, no nftables; the Docker host still needs larger socket buffer
# limits, see Notes. For kernel mode, use deploy/server.service instead; it is not supported in a
# container (see deploy/Dockerfile.server).
#
#   docker compose -f deploy/server.compose.yaml up -d
#
# The image is pulled from GHCR (amd64 and arm64). To build it from this repository instead,
# uncomment the build: lines below and add --build to the command above.
#
# Notes
# - No privileges: no --privileged, no cap_add, no devices (user-space netstack, so no TUN).
# - Socket buffers: the Docker host must have net.core.rmem_max and net.core.wmem_max at 7340032
#   or more, since the WireGuard sockets need 7 MiB buffers; a container cannot set them, and
#   docker run --sysctl fails for them. Set them on the host and restart the container; the
#   server logs a warning at start while they fall short. See docs/socket-buffers.md.
# - The image runs as uid 65532 (the distroless "nonroot" user), not root. The named volume
#   below is fine as is: Docker/Podman initialise a named volume from the image directory,
#   ownership included, so /var/lib/wgft in the volume comes out owned by 65532.
# - Ports: WGFT_WG_PORT (default 51820/udp) is where agents' tunnels connect, and 8443/tcp is the
#   agent API. Both must be reachable from the internet. Every forwarded port (rule add --udp /
#   --tcp) needs the same: add it below or use network_mode: host.
# - The simplest way to publish an arbitrary set of forwarded ports without editing this file
#   for every rule is network_mode: host, commented out below. It also removes any doubt about
#   Docker's own bridge networking getting in the way of the userspace dataplane. Its cost:
#   the container then runs in the host's network namespace, where the nonroot user cannot bind
#   ports below 1024 (verified: 443 gives "bind: permission denied"). With the bridge network
#   and the ports: list, 443 and other low ports work (verified).
# - WGFT_WG_ENDPOINT is required: the host:port that agents dial, this VPS's address plus the
#   WireGuard UDP port. Edit it before the first start.
# - Rules and agents are managed with the CLI inside the running container, which reads the same
#   WGFT_ADMIN as the server and talks to the admin socket in the state volume:
#     docker compose -f deploy/server.compose.yaml exec wgft-server wgft agent join-string --name home
#     docker compose -f deploy/server.compose.yaml exec wgft-server wgft rule add --agent home --udp 2456-2457 --to 192.168.1.20:2456 --group game
#     docker compose -f deploy/server.compose.yaml exec wgft-server wgft agent ls
# - Logging: the json-file driver below caps the container log at about 30 MiB (3 files of 10 MiB)
#   instead of Docker's unbounded default. The agent API's listening port is reachable by anyone on
#   the internet before any authentication, so the server's own log rate does not bound what an
#   unauthenticated sender can make it write; the driver-level cap is the backstop. Setting driver
#   here overrides any other default set in the Docker daemon's daemon.json, such as journald or
#   local; edit the logging section below instead if you rely on that default.
services:
  wgft-server:
    image: ghcr.io/rahanahu/wgft-server:latest
    # build:
    #   context: ..
    #   dockerfile: deploy/Dockerfile.server
    container_name: wgft-server
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # No capabilities, no privilege escalation, read-only root file system. The only writable
    # path is the state volume.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    environment:
      WGFT_WG_ENDPOINT: "REPLACE_WITH_vps.example.com:51820"
      # Optional: process-wide caps on concurrent flows (defaults 8192 UDP sessions and 2048 TCP
      # connections). They cap how many flows the server holds at once under an attack that opens
      # flows and holds them; the memory soft limit printed at startup is derived from them, but a
      # soft limit is a GC target, not a memory bound. With the default caps, one agent and one
      # forwarded TCP port, this server needs a host with about 10.1 GiB of memory. That is the
      # documented worst-case estimate: the flow state, buffers and other holdings counted in
      # docs/design/userspace/memory-server.md, each filled to its limit at once by an attack; it is
      # not a normal-use estimate. Lower caps shrink it, but not below about 3.0 GiB.
      # docs/design/userspace/memory-agent-host.md gives a table of lower caps for smaller hosts.
      # WGFT_MAX_UDP_FLOWS: "8192"
      # WGFT_MAX_TCP_FLOWS: "2048"
    ports:
      - "51820:51820/udp"
      - "8443:8443/tcp"
      # one line per forwarded port or range, matching the rules added with `wgft rule add`
      - "2456-2457:2456-2457/udp"
    volumes:
      - wgft-server-state:/var/lib/wgft
    # Publishes every port instead of listing them above; the simplest choice when rules change
    # often. Remove the ports: list above if you use this. Ports below 1024 are not available in
    # this mode (see the note at the top).
    # network_mode: host

volumes:
  wgft-server-state:
