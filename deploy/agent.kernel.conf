# systemd drop-in for deploy/agent.service: lets the agent run in kernel mode, WGFT_MODE=kernel in
# /etc/wgft/agent.env. agent.service itself stays unprivileged, as userspace mode needs no
# capabilities. Download it from the same release tag as the binary, install it next to the unit and
# restart:
#   curl -fLO "https://raw.githubusercontent.com/rahanahu/wgft/$(wgft version | head -n 1)/deploy/agent.kernel.conf"
#   sudo install -D -m 0644 agent.kernel.conf /etc/systemd/system/wgft-agent.service.d/kernel.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart wgft-agent
#
# CAP_NET_ADMIN alone covers everything kernel mode does: the WireGuard interface, table inet
# wgft_agent, deleting conntrack entries and writing net.ipv4.ip_forward. The agent still runs as the
# wgft user, and the rest of the unit's sandbox stays as it is.
#
# Keep ProtectKernelTunables= off, as agent.service has it: it makes /proc/sys read-only, and the
# agent sets net.ipv4.ip_forward to 1 when it is 0. Keep AF_NETLINK in RestrictAddressFamilies=:
# every kernel-mode operation goes over netlink.
#
# To go back to userspace mode, stop the agent, run `sudo wgft agent teardown`, remove WGFT_MODE=kernel
# from agent.env, delete this file, then daemon-reload and start the agent again.
[Service]
AmbientCapabilities=CAP_NET_ADMIN
# agent.service empties the bounding set with CapabilityBoundingSet=; a non-empty assignment in a
# drop-in adds to it, so this line puts back only CAP_NET_ADMIN, which the ambient set needs.
CapabilityBoundingSet=CAP_NET_ADMIN
